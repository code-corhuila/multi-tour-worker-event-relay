name: ci

# gofmt, go vet and go test. Pull requests toward develop and qa only. No schedule.
on:
  pull_request:
    branches: [develop, qa]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      # The compose file must be valid; the token is a placeholder, nothing starts
      - name: compose config
        run: docker compose -f deploy/compose.yml config -q
        env:
          SERVICE_TOKEN: ci-placeholder
          SECURITY_BASE_URL: http://security:8086
          IDENTITY_AUDIT_BASE_URL: http://identity-audit-api:8082
      # Catches a base image tag that does not exist; nothing is pushed
      - name: docker build
        run: docker build -f deploy/Dockerfile .
