# The relay has no database and no volume, and publishes no port: it reaches the services by their
# names on the platform network, and the root composition (multi-tour-infra-postgres) includes this file.
services:
  worker-event-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      # Issued by the identity service for this worker; never versioned.
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN is required, set it in env/<environment>.env}
      # No default: a wrong guess of a service name or port must fail visibly.
      SECURITY_BASE_URL: ${SECURITY_BASE_URL:?SECURITY_BASE_URL is required, e.g. http://security:8086}
      IDENTITY_AUDIT_BASE_URL: ${IDENTITY_AUDIT_BASE_URL:?IDENTITY_AUDIT_BASE_URL is required, e.g. http://identity-audit-api:8082}
      RELAY_INTERVAL: ${RELAY_INTERVAL:-5s}
      BATCH_SIZE: ${BATCH_SIZE:-100}
      RUN_TIMEOUT: ${RUN_TIMEOUT:-30s}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-5s}
      HTTP_ATTEMPTS: ${HTTP_ATTEMPTS:-3}
      HEALTH_ADDR: ${HEALTH_ADDR:-:8080}
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks: [platform]

networks:
  platform:
    external: true
